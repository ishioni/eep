---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".release-please-manifest.json"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-26.04
    outputs:
      go-version: ${{ steps.versions.outputs.go-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: false
          experimental: true
          install: false
      - name: Read configured tool versions
        id: versions
        run: |
          echo "go-version=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

  image:
    name: Publish image
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1.18.0
    with:
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
        GO_VERSION=${{ needs.versions.outputs.go-version }}
      cache: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      # The OCI image is a transport container for the architecture-independent WASM module.
      platforms: linux/amd64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  wasm:
    name: Publish WASM artifact
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: false
          experimental: true
          install_args: --locked
      - name: Build release WASM
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          mise run build
          cp main.wasm eep.wasm
          sha256sum eep.wasm > eep.wasm.sha256
      - name: Attach WASM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          eep.wasm
          eep.wasm.sha256
          --clobber
