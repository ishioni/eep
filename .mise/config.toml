# mise is the project toolchain source of truth. Run `mise tasks` to discover
# the same build, test, lint, and image commands used by CI.

[tools]
actionlint = "1.7.12"
go = "1.26.6"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.7.0"
golangci-lint = "2.12.2"
lefthook = "2.1.10"
oxfmt = "0.63.0"
wasm-tools = "1.256.0"
zizmor = "1.29.0"

[tasks.build-raw]
description = "Compile the unpatched Go WASM module"
run = """
GOOS=wasip1 GOARCH=wasm go build -trimpath -buildmode=c-shared \
  -ldflags "-s -w -X main.version=${VERSION:-dev}" \
  -o main.raw.wasm main.go
"""

[tasks.patch-wasm]
description = "Patch unsupported WASI imports for Envoy"
run = "go run ./tools/patch-wasi-imports -in main.raw.wasm -out main.wasm"

[tasks.validate-wasm]
description = "Validate the patched WASM module"
run = "wasm-tools validate main.wasm"

[tasks.build]
description = "Build, patch, and validate the release WASM module"
run = """
mise run build-raw
mise run patch-wasm
mise run validate-wasm
"""

[tasks.test]
description = "Run the Go test suite with the race detector and coverage"
run = "go test -race -timeout 30s ./... -coverprofile=cover.out"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.vulncheck]
description = "Scan for known Go vulnerabilities"
run = "govulncheck ./..."

[tasks.fmt]
description = "Format Go sources"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Verify Go formatting"
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"

[tasks.oxfmt]
description = "Format non-Go project files"
run = "oxfmt --write ."

[tasks.oxfmt-check]
description = "Verify non-Go project formatting"
run = "oxfmt --check ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.lint-fix]
description = "Run golangci-lint with automatic fixes"
run = "golangci-lint run --fix"

[tasks.tidy-check]
description = "Verify go.mod and go.sum are tidy"
run = """
go mod tidy
git diff --exit-code go.mod go.sum
"""

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint .github/workflows/*.yaml"

[tasks.zizmor]
description = "Audit GitHub Actions workflows for security issues"
run = "zizmor .github"

[tasks.smoke]
description = "Build the module and test it through Envoy"
run = "./tools/smoke-envoy.sh"

[tasks.docker-build]
description = "Build the OCI artifact"
run = """
docker build \
  --build-arg GO_VERSION=\"$(mise config get tools.go)\" \
  --build-arg WASM_TOOLS_VERSION=\"$(mise config get tools.wasm-tools)\" \
  --build-arg VERSION=\"${VERSION:-dev}\" \
  --tag eep .
"""

[tasks.docker-run]
description = "Build the module and run the local Envoy stack"
run = """
mise run build
docker compose up --build
"""

[tasks.clean]
description = "Remove generated build and test artifacts"
run = "rm -f main.raw.wasm main.wasm main.wasm.wat cover.out"

[hooks]
postinstall = "lefthook install"
